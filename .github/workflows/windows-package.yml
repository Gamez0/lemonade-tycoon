name: Windows package saves
on:
    workflow_call:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    packaged-saves:
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npm run test:release
            - run: npm run desktop:package:win
            - name: Audit shipped archive and license notices
              run: node scripts/audit-package.cjs "release/Lemonade Tycoon-win32-x64"
            - name: Test packaged save and recovery
              shell: pwsh
              run: |
                  $env:LEMONADE_DESKTOP_EXE = Join-Path $env:GITHUB_WORKSPACE 'release/Lemonade Tycoon-win32-x64/Lemonade Tycoon.exe'
                  foreach ($suite in @('test:desktop', 'test:desktop:ui', 'test:desktop:dpi', 'test:desktop:locations', 'test:desktop:management')) {
                      npm run $suite
                      if ($LASTEXITCODE -ne 0) {
                          throw "Windows package suite $suite failed with exit code $LASTEXITCODE"
                      }
                  }
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: windows-ui-${{ github.event.pull_request.head.sha || github.sha }}
                  path: |
                      test-results/desktop-ui/
                      test-results/desktop-dpi/
                  if-no-files-found: ignore
                  retention-days: 7
            - name: Record package source
              shell: pwsh
              run: |
                  $info = @{ commit = '${{ github.sha }}'; source_commit = '${{ github.event.pull_request.head.sha || github.sha }}'; run = '${{ github.run_id }}'; prototype = $true }
                  $info | ConvertTo-Json | Set-Content 'release/Lemonade Tycoon-win32-x64/build-info.json'
            - name: Inventory and verify prototype files
              run: |
                  node scripts/release-manifest.cjs "release/Lemonade Tycoon-win32-x64"
                  node scripts/release-manifest.cjs "release/Lemonade Tycoon-win32-x64" --verify
            - uses: actions/upload-artifact@v6
              with:
                  name: windows-prototype-${{ github.event.pull_request.head.sha || github.sha }}
                  path: release/Lemonade Tycoon-win32-x64/
                  if-no-files-found: error
                  retention-days: 3
