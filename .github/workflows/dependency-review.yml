name: Dependency review
on:
    pull_request:
permissions:
    contents: read
concurrency:
    group: dependency-review-${{ github.ref }}
    cancel-in-progress: true
jobs:
    dependency-review:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
            - uses: actions/dependency-review-action@v4
              with:
                  fail-on-severity: moderate
