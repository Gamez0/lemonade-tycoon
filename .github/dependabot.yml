version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies]
    # typescript-eslint currently supports TypeScript <6.1; revisit with tooling.
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1.0']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, github]
    groups:
      actions:
        patterns: ['*']
